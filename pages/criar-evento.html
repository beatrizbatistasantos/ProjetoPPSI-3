<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Publicar Evento</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/formulario.css">

</head>

<body>

  <a href="../index.html" class="voltar">
    ⬅
  </a>

  <h1>📢 Publicar Evento</h1>

  <div class="form-container">

    <form id="formEvento">

  <div class="campo">
    <label>Nome do Evento</label>
    <input id="nomeEvento" type="text" placeholder="Digite o nome do evento">
  </div>

  <div class="campo">
    <label>Descrição</label>
    <textarea id="descricaoEvento" placeholder="Descreva o evento..."></textarea>
  </div>

  <div class="campo">
    <label>Cidade</label>
    <select id="cidadeEvento">
      <option>São Vicente</option>
      <option>Santos</option>
      <option>Guarujá</option>
      <option>Praia Grande</option>
    </select>
  </div>

  <div class="campo">
    <label>Endereço</label>
    <input id="enderecoEvento" type="text" placeholder="Digite o endereço">
  </div>

  <div class="dupla">

    <div class="campo">
      <label>Data</label>
      <input id="dataEvento" type="date">
    </div>

    <div class="campo">
      <label>Horário Inicial</label>
      <input id="horaInicio" type="time">
    </div>

  </div>

  <div class="campo">
    <label>Horário Final</label>
    <input id="horaFim" type="time">
  </div>

  <div class="campo">
    <label>Imagem do Evento</label>
    <input id="imagemEvento" type="file" accept="image/*">
  </div>

  <details class="painel">

    <summary>🎟️ Informações de Entrada</summary>

    <div class="conteudo-painel">

      <div class="campo">
        <label>Tipo de Entrada</label>

        <select id="tipoEntrada">
          <option>Gratuito</option>
          <option>Pago</option>
          <option>Pago + Alimento</option>
          <option>Somente Alimento</option>
        </select>
      </div>

      <div class="campo">
        <label>Valor do Ingresso</label>
        <input id="valorIngresso" type="text" placeholder="Ex: R$ 20,00">
      </div>

      <div class="campo">
        <label>Alimento Solidário</label>
        <input id="alimentoSolidario" type="text" placeholder="Ex: 1kg de alimento">
      </div>

    </div>

  </details>

  <details class="painel">

    <summary>👥 Convidados</summary>

    <div class="conteudo-painel">

      <div class="campo">
        <label>Convidado 1</label>
        <input id="convidado1" type="text" placeholder="Nome do convidado">
      </div>

      <div class="campo">
        <label>Convidado 2</label>
        <input id="convidado2" type="text" placeholder="Nome do convidado">
      </div>

      <div class="campo">
        <label>Convidado 3</label>
        <input id="convidado3" type="text" placeholder="Nome do convidado">
      </div>

      <div class="campo">
        <label>Convidado 4</label>
        <input id="convidado4" type="text" placeholder="Nome do convidado">
      </div>

    </div>

  </details>

  <details class="painel">

    <summary>🎭 Atrações</summary>

    <div class="conteudo-painel">

      <div class="campo">
  <label>Atração 1</label>
  <input id="atracao1" type="text" placeholder="Ex: Concurso Cosplay">
</div>

<div class="campo">
  <label>Descrição da Atração 1</label>
  <textarea id="descricaoAtracao1" placeholder="Explique a atração"></textarea>
</div>

      <div class="campo">
  <label>Atração 2</label>
  <input id="atracao2" type="text" placeholder="Ex: Concurso K-pop">
</div>

<div class="campo">
  <label>Descrição da Atração 2</label>
  <textarea id="descricaoAtracao2" placeholder="Explique a atração"></textarea>
</div>

      <div class="campo">
  <label>Atração 3</label>
  <input id="atracao3" type="text" placeholder="Ex: Arena Gamer">
</div>

<div class="campo">
  <label>Descrição da Atração 3</label>
  <textarea id="descricaoAtracao3" placeholder="Explique a atração"></textarea>
</div>

    </div>

  </details>

  <button type="submit" class="publicar">
    🚀 Publicar Evento
  </button>

</form>

  </div>

  <footer>
    Feito com 🧡 para a comunidade geek da Baixada Santista
  </footer>

<script src="../js/criar-evento.js"></script>

</body>
</html>
